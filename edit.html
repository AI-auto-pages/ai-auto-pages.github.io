<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>编辑 · 妖者发电站</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1c1917;--muted:#78716c;--line:#e9e6e1;--accent:#0f766e;--gold:#d97706;--danger:#dc2626;--shadow:0 8px 24px rgba(28,25,23,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;line-height:1.65}
a{color:var(--accent);word-break:break-all}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 150px}
h1{font-size:26px;margin:0 0 6px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-top:16px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;background:linear-gradient(90deg,rgba(15,118,110,.09),rgba(15,118,110,0) 72%)}
.card-head::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--gold));flex:none}
.card-head h2{font-size:16px;margin:0}
.card-body{padding:16px 18px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
label:first-child{margin-top:0}
input[type=text],input[type=password],input[type=number],textarea{width:100%;font-size:15px;padding:11px 12px;border:1.5px solid #d6d3d1;border-radius:8px;background:#fff;color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(15,118,110,.12)}
textarea{min-height:90px;resize:vertical}
button{font-size:15px;font-weight:650;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;background:#1c1917;color:#fff}
button.secondary{background:#fff;color:var(--text);border:1.5px solid #d6d3d1}
button.danger{background:#fff;color:var(--danger);border:1.5px solid #fecaca}
button:disabled{background:#d6d3d1;color:#a8a29e;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row button{flex:1;min-width:120px}
.product{border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:14px}
.product:first-of-type{margin-top:0}
.product-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.product-head strong{font-size:15px}
.status{padding:10px 12px;border-radius:8px;background:#f5f5f4;font-size:14px;white-space:pre-wrap;word-break:break-all;margin-top:16px}
.status.error{background:#fef2f2;color:#991b1b}
.status.ok{background:#ecfdf5;color:#065f46}
/* 与主页详情区完全一致的样式：背景、边框、圆角、内边距、行高 */
.preview{display:block;margin-top:12px;padding:13px 14px;background:#f5f5f4;border:1px solid var(--line);border-radius:8px;max-height:210px;overflow-y:auto}
.preview p{margin:8px 0}
.preview-label{font-size:13px;color:var(--muted);margin:14px 0 6px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 16px;z-index:20}
.savebar-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.savebar-inner input{font-size:15px;padding:12px;border:1.5px solid #d6d3d1;border-radius:8px}
.savebar-inner button{min-height:48px;font-size:16px;width:100%}
@media (max-width:480px){.wrap{padding:18px 12px 150px}.card-body{padding:14px 16px}}
@media (prefers-color-scheme: dark){:root{--bg:#0c0a09;--card:#1c1917;--text:#fafaf9;--muted:#a8a29e;--line:#292524;--shadow:0 8px 24px rgba(0,0,0,.35)}input[type=text],input[type=password],input[type=number],textarea{background:#1c1917;color:#fafaf9;border-color:#44403c}button{background:#fafaf9;color:#1c1917}button.secondary{background:#1c1917;color:#fafaf9;border-color:#44403c}button.danger{background:#1c1917;color:#fca5a5;border-color:#7f1d1d}.status{background:#292524}.preview{background:#292524}.savebar{background:rgba(28,25,23,.96)}.savebar-inner input{background:#1c1917;color:#fafaf9;border-color:#44403c}}
</style>
</head>
<body>
<main class="wrap">
  <h1>编辑</h1>
  <p class="muted">只用来维护本站的 <code>data/site.json</code>，里面只有标题和项目列表，项目只有名称、链接、价格、提示区四项。</p>

  <section class="card">
    <div class="card-head"><h2>基本设置</h2></div>
    <div class="card-body">
      <label for="fTitle">页面标题</label>
      <input id="fTitle" type="text">
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>项目列表</h2></div>
    <div class="card-body">
      <div id="productList"></div>
      <div class="row" style="margin-top:14px">
        <button id="addBtn" type="button" class="secondary">新增项目</button>
        <button id="downloadBtn" type="button" class="secondary">下载当前 JSON 备份</button>
      </div>
      <div id="status" class="status">正在加载当前 JSON……</div>
      <details style="margin-top:14px">
        <summary style="cursor:pointer;font-weight:650">查看当前 JSON（只读预览）</summary>
        <pre id="jsonPreview" style="white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:320px;overflow:auto"></pre>
      </details>
    </div>
  </section>
</main>

<div class="savebar"><div class="savebar-inner">
  <input id="token" type="password" placeholder="GitHub 令牌（细粒度令牌，只选本仓库，Contents 读写权限；不填则无法提交）" autocomplete="off">
  <button id="saveBtn" type="button">保存并提交到仓库</button>
</div></div>

<script>
const $ = id => document.getElementById(id);
const OWNER = 'AI-auto-pages';
const REPO = 'ai-auto-pages.github.io';
const BRANCH = 'main';
const JSON_PATH = 'data/site.json';
let data = null;
let originalJsonText = '';

function setStatus(msg, kind){
  const el = $('status');
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}
function decodeB64(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function encodeB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const chunk = 0x8000;
  for (let i=0;i<bytes.length;i+=chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return btoa(bin);
}
function apiUrl(){
  return 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + JSON_PATH;
}
function collectFromForm(){
  const products = [];
  document.querySelectorAll('.product').forEach(el => {
    products.push({
      name: el.querySelector('.pName').value,
      url: el.querySelector('.pUrl').value,
      price: el.querySelector('.pPrice').value === '' ? 1 : Number(el.querySelector('.pPrice').value),
      tips: el.querySelector('.pTips').value,
    });
  });
  return { title: $('fTitle').value, products: products };
}
function updatePreviewFor(el){
  const name = el.querySelector('.pName').value;
  const tips = el.querySelector('.pTips').value;
  el.querySelector('.preview').innerHTML = '<strong>' + name + '</strong>' + (tips ? '<div>' + tips + '</div>' : '');
}
function refreshPreview(){
  try { $('jsonPreview').textContent = JSON.stringify(collectFromForm(), null, 2); } catch(e) {}
  document.querySelectorAll('.product').forEach(updatePreviewFor);
}
document.addEventListener('input', e => { if (e.target.closest('.product') || e.target.id === 'fTitle') refreshPreview(); });
function renderForm(){
  if (!data) return;
  $('fTitle').value = data.title || '';
  const list = $('productList');
  list.innerHTML = '';
  (data.products || []).forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'product';
    div.innerHTML =
      '<div class="product-head"><strong>项目 ' + (idx+1) + '</strong><span class="row" style="flex:0 0 auto"><button type="button" class="secondary upBtn">上移</button><button type="button" class="secondary downBtn">下移</button><button type="button" class="danger delBtn">删除</button></span></div>' +
      '<label>名称</label><input class="pName" type="text">' +
      '<label>链接（url）</label><input class="pUrl" type="text" autocomplete="off">' +
      '<label>价格（price）</label><input class="pPrice" type="number" step="any">' +
      '<label>提示区（tips，填写 HTML）</label><textarea class="pTips"></textarea>' +
      '<div class="preview-label">提示区预览（与主页展示效果一致）</div>' +
      '<div class="preview"></div>';
    div.querySelector('.pName').value = p.name || '';
    div.querySelector('.pUrl').value = p.url || '';
    div.querySelector('.pPrice').value = (p.price ?? '');
    div.querySelector('.pTips').value = p.tips || '';
    div.querySelector('.delBtn').addEventListener('click', () => { if (confirm('确定删除这个项目吗？')) { div.remove(); refreshPreview(); } });
    div.querySelector('.upBtn').addEventListener('click', () => { const prev = div.previousElementSibling; if (prev) { list.insertBefore(div, prev); refreshPreview(); } });
    div.querySelector('.downBtn').addEventListener('click', () => { const next = div.nextElementSibling; if (next) { list.insertBefore(next, div); refreshPreview(); } });
    list.appendChild(div);
  });
  refreshPreview();
}
async function loadFromPages(){
  const res = await fetch('data/site.json?' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  data = await res.json();
  originalJsonText = JSON.stringify(data, null, 2);
  renderForm();
  setStatus('已加载当前 JSON（来自本站静态文件）。编辑后在最下方填写令牌并点保存，即可提交。', 'ok');
}
$('addBtn').addEventListener('click', () => {
  if (!data) data = { products: [] };
  if (!data.products) data.products = [];
  data.products.push({ name: '', url: '', price: 1, tips: '' });
  renderForm();
});
$('downloadBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(collectFromForm(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'site.json'; a.click(); URL.revokeObjectURL(a.href);
});
$('saveBtn').addEventListener('click', async () => {
  const token = $('token').value.trim();
  if (!token) { setStatus('请先在提交按钮上方的输入框里填写 GitHub 令牌，再点保存。', 'error'); $('token').focus(); return; }
  const newData = collectFromForm();
  if (!newData.products.length) { if (!confirm('项目列表为空，确定要提交一个空列表吗？')) return; }
  for (let i=0;i<newData.products.length;i++){ if (!newData.products[i].name) { setStatus('第 ' + (i+1) + ' 个项目没有填写名称，请先填写。', 'error'); return; } }
  $('saveBtn').disabled = true;
  setStatus('正在提交……先拿最新版本比对，避免覆盖别人刚提交的内容。');
  try {
    const getRes = await fetch(apiUrl() + '?ref=' + BRANCH, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' } });
    if (!getRes.ok) throw new Error('拿最新版本失败，HTTP ' + getRes.status + '。请检查令牌权限。');
    const latest = await getRes.json();
    const latestText = JSON.stringify(JSON.parse(decodeB64(latest.content)), null, 2);
    if (latestText !== originalJsonText) {
      if (!confirm('仓库里的最新版本和你加载时不一样，可能是有人刚提交过，或者页面部署还没更新。点确定表示用你现在编辑的内容覆盖最新版，点取消则先重新加载最新版再编辑。')) {
        data = JSON.parse(decodeB64(latest.content)); originalJsonText = latestText; renderForm(); setStatus('已取消提交，并重新加载了最新版本，请检查后再保存。', 'error'); $('saveBtn').disabled = false; return;
      }
    }
    const body = { message: 'Update data/site.json via edit page', content: encodeB64(JSON.stringify(newData, null, 2)), sha: latest.sha, branch: BRANCH };
    const putRes = await fetch(apiUrl(), { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const putJson = await putRes.json();
    if (!putRes.ok) throw new Error('提交失败，HTTP ' + putRes.status + '：' + (putJson.message || '未知错误'));
    originalJsonText = JSON.stringify(newData, null, 2);
    data = newData;
    setStatus('提交成功！提交链接：' + (putJson.commit && putJson.commit.html_url ? putJson.commit.html_url : '请在仓库提交记录里查看') + '。等 Pages 重新部署几分钟后，主页就会更新。', 'ok');
  } catch(e) {
    setStatus('提交失败：' + e.message, 'error');
  } finally { $('saveBtn').disabled = false; }
});
loadFromPages().catch(e => setStatus('加载失败：' + e.message + '。请检查网络后刷新页面重试。', 'error'));
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妖者发电站</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --text:#1c1917; --muted:#78716c; --line:#e9e6e1;
  --accent:#0f766e; --shadow:0 8px 24px rgba(28,25,23,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;line-height:1.6}
a{color:var(--accent);word-break:break-all}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 16px}
h1{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:29px;line-height:1.3;margin:0 0 14px;text-align:center;letter-spacing:.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.card:first-of-type{margin-top:0}
.card-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-head::before{content:"";width:4px;height:18px;border-radius:99px;background:var(--accent);flex:none}
.card-head h2{font-size:16px;margin:0;line-height:1.4}
.card-body{padding:14px 18px}
.card-body p{margin:8px 0}
.card-body p:first-child{margin-top:0}
.card-body p:last-child{margin-bottom:0}
.notice-list{margin:0;padding-left:18px}
.notice-list li{margin:5px 0}
.select-wrap{position:relative}
select{width:100%;appearance:none;-webkit-appearance:none;font-size:16px;padding:13px 42px 13px 14px;border:1.5px solid #d6d3d1;border-radius:12px;background:#fff;color:var(--text);cursor:pointer}
select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(15,118,110,.12)}
.select-wrap::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid #78716c;border-bottom:2px solid #78716c;transform:translateY(-70%) rotate(45deg);pointer-events:none}
button{width:100%;min-height:48px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:#1c1917;color:#fff;cursor:pointer;margin-top:12px;transition:transform .12s, box-shadow .15s}
button:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(28,25,23,.16)}
button:not(:disabled):active{transform:scale(.99)}
button:disabled{background:#d6d3d1;color:#a8a29e;cursor:not-allowed}
.detail{display:none;margin-top:12px;padding:12px 14px;background:#f5f5f4;border:1px solid var(--line);border-radius:12px;max-height:190px;overflow-y:auto}
.detail.show{display:block}
.detail p{margin:8px 0}
details{padding:2px 0}
summary{cursor:pointer;font-weight:650;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted)}
details[open] summary::after{content:"−"}
details p{margin:10px 0 2px;color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;padding:12px 16px 8px}
@media (min-width:768px){
  .wrap{padding:20px 16px 10px}
  h1{font-size:28px;margin-bottom:12px}
  .card{margin-top:11px}
  .card-head{padding:11px 18px}
  .card-body{padding:12px 18px}
  select{padding:12px 42px 12px 14px}
  button{min-height:46px;margin-top:11px}
  .detail{max-height:170px}
  footer{padding:10px 16px 6px}
}
@media (max-width:480px){
  .wrap{padding:16px 12px}
  h1{font-size:26px}
  .card{border-radius:16px}
  .card-head,.card-body{padding-left:16px;padding-right:16px}
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0c0a09;--card:#1c1917;--text:#fafaf9;--muted:#a8a29e;--line:#292524;--accent:#5eead4;--shadow:0 8px 24px rgba(0,0,0,.35)}
  select{background:#1c1917;color:#fafaf9;border-color:#44403c}
  button{background:#fafaf9;color:#1c1917}
  button:disabled{background:#44403c;color:#a8a29e}
  .detail{background:#292524}
}
</style>
</head>
<body>
<main class="wrap">
  <h1 id="siteTitle">妖者发电站</h1>

  <section class="card">
    <div class="card-head"><h2>说明</h2></div>
    <div class="card-body">
      <ul class="notice-list">
        <li><strong>防失联，请认准此页面，建议收藏</strong></li>
        <li>永久地址：<a href="https://ai-auto-pages.github.io/">https://ai-auto-pages.github.io/</a></li>
        <li>原创不易，请大家支持作者！乐意的话，可以多支持几份。</li>
      </ul>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>选择项目</h2></div>
    <div class="card-body">
      <div class="select-wrap">
        <select id="projectSelect"><option>数据加载中……</option></select>
      </div>
      <div id="detail" class="detail"></div>
      <button id="actionBtn" disabled>请先选择</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>常见问题</h2></div>
    <div class="card-body">
      <details>
        <summary>蓝奏云打不开？</summary>
        <p>把链接里的蓝奏云域名换成你能访问的域名再打开，也可以通过搜索找到当前可用的蓝奏云域名。</p>
      </details>
    </div>
  </section>
</main>
<footer>本页面由粉丝支持赞助，与其他任何平台以及平台用户无关。</footer>

<script>
const select = document.getElementById('projectSelect');
const detail = document.getElementById('detail');
const btn = document.getElementById('actionBtn');
let products = [];

function decodeGithubContent(b64){
  const binary = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
async function fetchGithubJson(repoPath){
  const dataUrl = 'repos/blog-auto/json/contents/' + repoPath + '?ref=main&' + Date.now();
  const urls = ['/api.github.com/' + dataUrl, 'https://api.github.com/' + dataUrl];
  let lastErr = null;
  for (const u of urls){
    try {
      const res = await fetch(u);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (!json.content) throw new Error('no content');
      return JSON.parse(decodeGithubContent(json.content));
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('fetch failed');
}
function transformProduct(p, apiUrlValue){
  try {
    if (!p.url) return p;
    const urlObj = new URL(p.url);
    const params = new URLSearchParams(urlObj.search);
    const sku = params.get('sku');
    if (!sku) return p;
    const skuArray = JSON.parse(decodeURIComponent(sku));
    if (!skuArray || !skuArray[0]) return p;
    skuArray[0].count = p.price || 1;
    params.set('sku', JSON.stringify(skuArray));
    const timestamp = Date.now().toString();
    const randomNum = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
    p.custom_order_id = '[' + timestamp + randomNum + '][' + p.gcode + '][' + p.cipher_key + ']';
    params.set('custom_order_id', p.custom_order_id);
    p.url = urlObj.origin + urlObj.pathname + '?' + params.toString();
    p.sku_id = skuArray[0].sku_id;
    if (apiUrlValue) {
      p.pay_url = apiUrlValue + '/pay-in1?i=' + p.plan_id + '&sk=' + p.sku_id + '&pr=' + p.price + '&co=' + timestamp + randomNum + '&g=' + p.gcode + '&k=' + p.cipher_key;
    }
  } catch (e) {}
  return p;
}
async function load(){
  try {
    const data = await fetchGithubJson('users/admin.json');
    if (data.title) { document.getElementById('siteTitle').textContent = data.title; document.title = data.title; }
    products = (data.products || []).map(p => transformProduct(Object.assign({}, p), data.api_url || ''));
    select.innerHTML = '<option value="">请选择</option>' + products.map((p, i) => '<option value="' + i + '">' + p.name + '</option>').join('');
  } catch (e) {
    select.innerHTML = '<option value="">数据加载失败，请刷新重试</option>';
  }
}
select.addEventListener('change', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) { detail.classList.remove('show'); btn.disabled = true; btn.textContent = '请先选择'; return; }
  detail.classList.add('show');
  detail.innerHTML = '<strong>' + p.name + '</strong>' + (p.tips ? '<div>' + p.tips + '</div>' : '');
  btn.disabled = false; btn.textContent = '去发电';
});
btn.addEventListener('click', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) return;
  const target = p.pay_url || p.url;
  if (target) window.open(target, '_blank');
});
load();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>
/* Theme before first paint: read the stored choice (light / dark /
   system, default system), and set data-theme on <html> so Bulma
   and bulma-theme.css paint the right theme immediately, with no
   light flash on a dark phone. System means: follow matchMedia,
   and the main script below listens for system changes. */
(function () {
  try {
    var choice = localStorage.getItem('ai-auto-pages-theme') || 'system';
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var effective = choice === 'dark' ? 'dark' : choice === 'light' ? 'light' : (dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', effective);
    document.documentElement.setAttribute('data-theme-choice', choice);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妖者发电站</title>
<link rel="stylesheet" href="bulma.min.css">
<link rel="stylesheet" href="bulma-theme.css?v=20261026-21">
</head>
<body>
<section class="section site-section">
<div class="site-container">
<div class="theme-switch">
  <button type="button" class="theme-switch-toggle" aria-haspopup="true" aria-expanded="false" aria-label="切换主题" title="切换主题"><span class="theme-switch-icon">🌓</span><span class="theme-switch-caret">▾</span></button>
  <div class="theme-switch-menu" role="menu" aria-label="主题">
    <button type="button" role="menuitem" data-theme-choice="light" title="浅色" aria-label="浅色主题">☀</button>
    <button type="button" role="menuitem" data-theme-choice="dark" title="深色" aria-label="深色主题">🌙</button>
    <button type="button" role="menuitem" data-theme-choice="system" title="跟随系统" aria-label="跟随系统主题">🌓</button>
  </div>
</div>
  <h1 id="siteTitle" class="title has-text-centered">妖者发电站</h1>

  <div class="card mb-5">
    <header class="card-header"><p class="card-header-title">说明</p></header>
    <div class="card-content">
      <div class="content">
        <ul>
          <li><strong>防失联，请认准此页面，建议收藏</strong></li>
          <li>永久地址：<a href="https://ai-auto-pages.github.io/">https://ai-auto-pages.github.io/</a></li>
          <li>原创不易，请大家支持作者！乐意的话，可以多支持几份。</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="card mb-5">
    <header class="card-header"><p class="card-header-title">选择项目</p></header>
    <div class="card-content">
      <div class="field">
        <div class="control">
          <div class="select is-fullwidth">
            <select id="projectSelect"><option>数据加载中……</option></select>
          </div>
        </div>
      </div>
      <div id="detail" class="detail"></div>
      <button id="actionBtn" class="button is-primary is-fullwidth is-medium mt-4" disabled>请先选择</button>
    </div>
  </div>

  <div class="card mb-5" id="faqSection">
    <header class="card-header"><p class="card-header-title">常见问题</p></header>
    <div class="card-content">
      <div id="faqList"></div>
    </div>
  </div>

  <footer class="footer has-text-centered has-text-grey is-size-7 pt-4 pb-2">本页面由粉丝支持赞助，与其他任何平台以及平台用户无关。</footer>
</div>
</section>

<script>
const select = document.getElementById('projectSelect');
const detail = document.getElementById('detail');
const btn = document.getElementById('actionBtn');
let products = [];

async function load(){
  try {
    const res = await fetch('data/site.json?' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.title) { document.getElementById('siteTitle').textContent = data.title; document.title = data.title; }
    products = data.products || [];
    select.innerHTML = '<option value="">请选择</option>' + products.map((p, i) => '<option value="' + i + '">' + p.name + '</option>').join('');
    const faqs = data.faqs || [];
    const faqList = document.getElementById('faqList');
    const faqSection = document.getElementById('faqSection');
    if (!faqs.length) { faqSection.style.display = 'none'; }
    else {
      faqSection.style.display = '';
      faqList.innerHTML = '';
      faqs.forEach(f => {
        const question = f['问题'] || f.question || '';
        const answer = f['回答'] || f.answer || '';
        if (!question && !answer) return;
        const d = document.createElement('details');
        const s = document.createElement('summary');
        s.textContent = question;
        const a = document.createElement('div');
        a.innerHTML = answer;
        d.appendChild(s); d.appendChild(a); faqList.appendChild(d);
      });
    }
  } catch (e) {
    select.innerHTML = '<option value="">数据加载失败，请刷新重试</option>';
  }
}
select.addEventListener('change', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) { detail.classList.remove('show'); btn.disabled = true; btn.textContent = '请先选择'; return; }
  if (p.tips) { detail.classList.add('show'); detail.innerHTML = '<div>' + p.tips + '</div>'; } else { detail.classList.remove('show'); detail.innerHTML = ''; }
  btn.disabled = false; btn.textContent = '去发电';
});
btn.addEventListener('click', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) return;
  const target = p.url;
  if (target) window.open(target, '_blank');
});
load();
</script>
<script>
/* Theme switch: one button + dropdown. Choice is stored
   (light / dark / system) and shared by both pages via
   localStorage. System does not mean a CSS media query: it means
   this script sets data-theme from matchMedia and updates it when
   the system theme changes, so manual Light always wins over a
   dark phone, and manual Dark always wins over a light phone.
   The head script already set the first paint. Collapsed, the
   toggle shows only the current theme's symbol; the dropdown
   lists all three, the current one ticked. */
(function () {
  var KEY = 'ai-auto-pages-theme';
  var ICONS = { light: '☀', dark: '🌙', system: '🌓' };
  var root = document.querySelector('.theme-switch');
  if (!root) return;
  var toggle = root.querySelector('.theme-switch-toggle');
  var icon = root.querySelector('.theme-switch-icon');
  var items = root.querySelectorAll('.theme-switch-menu button');
  var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effective(choice) {
    if (choice === 'dark') return 'dark';
    if (choice === 'light') return 'light';
    return media && media.matches ? 'dark' : 'light';
  }
  function closeMenu() {
    root.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  }
  function apply(choice) {
    try { localStorage.setItem(KEY, choice); } catch (e) {}
    document.documentElement.setAttribute('data-theme', effective(choice));
    document.documentElement.setAttribute('data-theme-choice', choice);
    icon.textContent = ICONS[choice] || ICONS.system;
    items.forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-theme-choice') === choice);
    });
  }
  toggle.addEventListener('click', function () {
    var open = root.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  items.forEach(function (b) {
    b.addEventListener('click', function () { apply(b.getAttribute('data-theme-choice')); closeMenu(); });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.theme-switch')) closeMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeMenu(); toggle.focus(); }
  });
  if (media && media.addEventListener) {
    media.addEventListener('change', function () {
      var choice = document.documentElement.getAttribute('data-theme-choice') || 'system';
      if (choice === 'system') apply('system');
    });
  }
  try { apply(localStorage.getItem(KEY) || 'system'); } catch (e) { apply('system'); }
})();
</script>
</body>
</html>

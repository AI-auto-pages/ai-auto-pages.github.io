<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妖者发电站</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --text:#1c1917; --muted:#78716c; --line:#e9e6e1;
  --accent:#0f766e; --gold:#d97706; --shadow:0 8px 24px rgba(28,25,23,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;line-height:1.7}
a{color:var(--accent);word-break:break-all}
.wrap{max-width:620px;margin:0 auto;padding:24px 16px 18px}
h1{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:32px;line-height:1.3;margin:0 0 18px;text-align:center;letter-spacing:.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-top:16px}
.card:first-of-type{margin-top:0}
.card-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;background:linear-gradient(90deg,rgba(15,118,110,.09),rgba(15,118,110,0) 72%)}
.card-head::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--gold));flex:none}
.card-head h2{font-size:17px;margin:0;line-height:1.4;letter-spacing:.02em}
.card-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(15,118,110,.25),rgba(15,118,110,0));margin-left:4px}
.card-body{padding:18px}
.card-body p{margin:9px 0}
.card-body p:first-child{margin-top:0}
.card-body p:last-child{margin-bottom:0}
.notice-list{margin:0;padding-left:18px}
.notice-list li{margin:6px 0}
.select-wrap{position:relative}
select{width:100%;appearance:none;-webkit-appearance:none;font-size:16px;padding:14px 42px 14px 14px;border:1.5px solid #d6d3d1;border-radius:8px;background:#fff;color:var(--text);cursor:pointer}
select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(15,118,110,.12)}
.select-wrap::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid #78716c;border-bottom:2px solid #78716c;transform:translateY(-70%) rotate(45deg);pointer-events:none}
button{width:100%;min-height:52px;font-size:16px;font-weight:700;border:0;border-radius:8px;background:#1c1917;color:#fff;cursor:pointer;margin-top:14px;transition:transform .12s, box-shadow .15s}
button:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(28,25,23,.16)}
button:not(:disabled):active{transform:scale(.99)}
button:disabled{background:#d6d3d1;color:#a8a29e;cursor:not-allowed}
.detail{display:none;margin-top:14px;padding:13px 14px;background:#f5f5f4;border:1px solid var(--line);border-radius:8px;max-height:210px;overflow-y:auto}
.detail.show{display:block}
.detail p{margin:8px 0}
details{padding:2px 0}
summary{cursor:pointer;font-weight:650;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted)}
details[open] summary::after{content:"−"}
details p{margin:10px 0 2px;color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;padding:16px 16px 8px}
@media (min-width:768px){
  .wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:28px 16px 14px}
  h1{font-size:33px;margin:0}
  .card{margin-top:0}
  .card-head{padding:16px 18px}
  .card-body{padding:19px 18px}
  footer{padding:14px 16px 6px}
}
@media (max-width:480px){
  .wrap{padding:20px 12px}
  h1{font-size:28px}
  .card-head,.card-body{padding-left:16px;padding-right:16px}
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0c0a09;--card:#1c1917;--text:#fafaf9;--muted:#a8a29e;--line:#292524;--accent:#5eead4;--gold:#fbbf24;--shadow:0 8px 24px rgba(0,0,0,.35)}
  .card-head{background:linear-gradient(90deg,rgba(94,234,212,.12),rgba(94,234,212,0) 72%)}
  select{background:#1c1917;color:#fafaf9;border-color:#44403c}
  button{background:#fafaf9;color:#1c1917}
  button:disabled{background:#44403c;color:#a8a29e}
  .detail{background:#292524}
}
</style>
</head>
<body>
<main class="wrap">
  <h1 id="siteTitle">妖者发电站</h1>

  <section class="card">
    <div class="card-head"><h2>说明</h2></div>
    <div class="card-body">
      <ul class="notice-list">
        <li><strong>防失联，请认准此页面，建议收藏</strong></li>
        <li>永久地址：<a href="https://ai-auto-pages.github.io/">https://ai-auto-pages.github.io/</a></li>
        <li>原创不易，请大家支持作者！乐意的话，可以多支持几份。</li>
      </ul>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>选择项目</h2></div>
    <div class="card-body">
      <div class="select-wrap">
        <select id="projectSelect"><option>数据加载中……</option></select>
      </div>
      <div id="detail" class="detail"></div>
      <button id="actionBtn" disabled>请先选择</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>常见问题</h2></div>
    <div class="card-body">
      <details>
        <summary>蓝奏云打不开？</summary>
        <p>把链接里的蓝奏云域名换成你能访问的域名再打开，也可以通过搜索找到当前可用的蓝奏云域名。</p>
      </details>
    </div>
  </section>

  <footer>本页面由粉丝支持赞助，与其他任何平台以及平台用户无关。</footer>
</main>

<script>
const select = document.getElementById('projectSelect');
const detail = document.getElementById('detail');
const btn = document.getElementById('actionBtn');
let products = [];

async function load(){
  try {
    const res = await fetch('data/site.json?' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.title) { document.getElementById('siteTitle').textContent = data.title; document.title = data.title; }
    products = data.products || [];
    select.innerHTML = '<option value="">请选择</option>' + products.map((p, i) => '<option value="' + i + '">' + p.name + '</option>').join('');
  } catch (e) {
    select.innerHTML = '<option value="">数据加载失败，请刷新重试</option>';
  }
}
select.addEventListener('change', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) { detail.classList.remove('show'); btn.disabled = true; btn.textContent = '请先选择'; return; }
  detail.classList.add('show');
  detail.innerHTML = '<strong>' + p.name + '</strong>' + (p.tips ? '<div>' + p.tips + '</div>' : '');
  btn.disabled = false; btn.textContent = '去发电';
});
btn.addEventListener('click', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) return;
  const target = p.url;
  if (target) window.open(target, '_blank');
});
load();
</script>
</body>
</html>

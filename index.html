<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妖者发电站</title>
<link rel="stylesheet" href="bulma.min.css">
<link rel="stylesheet" href="bulma-theme.css?v=20261026-9">
</head>
<body>
<section class="section site-section">
<div class="container site-container">
  <h1 id="siteTitle" class="title has-text-centered">妖者发电站</h1>

  <div class="card mb-5">
    <header class="card-header"><p class="card-header-title">说明</p></header>
    <div class="card-content">
      <div class="content">
        <ul>
          <li><strong>防失联，请认准此页面，建议收藏</strong></li>
          <li>永久地址：<a href="https://ai-auto-pages.github.io/">https://ai-auto-pages.github.io/</a></li>
          <li>原创不易，请大家支持作者！乐意的话，可以多支持几份。</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="card mb-5">
    <header class="card-header"><p class="card-header-title">选择项目</p></header>
    <div class="card-content">
      <div class="field">
        <div class="control">
          <div class="select is-fullwidth">
            <select id="projectSelect"><option>数据加载中……</option></select>
          </div>
        </div>
      </div>
      <div id="detail" class="detail"></div>
      <button id="actionBtn" class="button is-primary is-fullwidth is-medium mt-4" disabled>请先选择</button>
    </div>
  </div>

  <div class="card mb-5" id="faqSection">
    <header class="card-header"><p class="card-header-title">常见问题</p></header>
    <div class="card-content">
      <div id="faqList"></div>
    </div>
  </div>

  <footer class="footer has-text-centered has-text-grey is-size-7 pt-4 pb-2">本页面由粉丝支持赞助，与其他任何平台以及平台用户无关。</footer>
</div>
</section>

<script>
const select = document.getElementById('projectSelect');
const detail = document.getElementById('detail');
const btn = document.getElementById('actionBtn');
let products = [];

async function load(){
  try {
    const res = await fetch('data/site.json?' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.title) { document.getElementById('siteTitle').textContent = data.title; document.title = data.title; }
    products = data.products || [];
    select.innerHTML = '<option value="">请选择</option>' + products.map((p, i) => '<option value="' + i + '">' + p.name + '</option>').join('');
    const faqs = data.faqs || [];
    const faqList = document.getElementById('faqList');
    const faqSection = document.getElementById('faqSection');
    if (!faqs.length) { faqSection.style.display = 'none'; }
    else {
      faqSection.style.display = '';
      faqList.innerHTML = '';
      faqs.forEach(f => {
        const question = f['问题'] || f.question || '';
        const answer = f['回答'] || f.answer || '';
        if (!question && !answer) return;
        const d = document.createElement('details');
        const s = document.createElement('summary');
        s.textContent = question;
        const a = document.createElement('div');
        a.innerHTML = answer;
        d.appendChild(s); d.appendChild(a); faqList.appendChild(d);
      });
    }
  } catch (e) {
    select.innerHTML = '<option value="">数据加载失败，请刷新重试</option>';
  }
}
select.addEventListener('change', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) { detail.classList.remove('show'); btn.disabled = true; btn.textContent = '请先选择'; return; }
  if (p.tips) { detail.classList.add('show'); detail.innerHTML = '<div>' + p.tips + '</div>'; } else { detail.classList.remove('show'); detail.innerHTML = ''; }
  btn.disabled = false; btn.textContent = '去发电';
});
btn.addEventListener('click', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) return;
  const target = p.url;
  if (target) window.open(target, '_blank');
});
load();
</script>
</body>
</html>

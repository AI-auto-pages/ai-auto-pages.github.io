<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妖者发电站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1 id="siteTitle">妖者发电站</h1>

  <section class="card">
    <div class="card-head"><h2>说明</h2></div>
    <div class="card-body">
      <ul class="notice-list">
        <li><strong>防失联，请认准此页面，建议收藏</strong></li>
        <li>永久地址：<a href="https://ai-auto-pages.github.io/">https://ai-auto-pages.github.io/</a></li>
        <li>原创不易，请大家支持作者！乐意的话，可以多支持几份。</li>
      </ul>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>选择项目</h2></div>
    <div class="card-body">
      <div class="select-wrap">
        <select id="projectSelect"><option>数据加载中……</option></select>
      </div>
      <div id="detail" class="detail"></div>
      <button id="actionBtn" class="action-btn" disabled>请先选择</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>常见问题</h2></div>
    <div class="card-body">
      <details>
        <summary>蓝奏云打不开？</summary>
        <p>把链接里的蓝奏云域名换成你能访问的域名再打开，也可以通过搜索找到当前可用的蓝奏云域名。</p>
      </details>
    </div>
  </section>

  <footer>本页面由粉丝支持赞助，与其他任何平台以及平台用户无关。</footer>
</main>

<script>
const select = document.getElementById('projectSelect');
const detail = document.getElementById('detail');
const btn = document.getElementById('actionBtn');
let products = [];

async function load(){
  try {
    const res = await fetch('data/site.json?' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.title) { document.getElementById('siteTitle').textContent = data.title; document.title = data.title; }
    products = data.products || [];
    select.innerHTML = '<option value="">请选择</option>' + products.map((p, i) => '<option value="' + i + '">' + p.name + '</option>').join('');
  } catch (e) {
    select.innerHTML = '<option value="">数据加载失败，请刷新重试</option>';
  }
}
select.addEventListener('change', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) { detail.classList.remove('show'); btn.disabled = true; btn.textContent = '请先选择'; return; }
  if (p.tips) { detail.classList.add('show'); detail.innerHTML = '<div>' + p.tips + '</div>'; } else { detail.classList.remove('show'); detail.innerHTML = ''; }
  btn.disabled = false; btn.textContent = '去发电';
});
btn.addEventListener('click', () => {
  const idx = select.value === '' ? -1 : Number(select.value);
  const p = idx >= 0 ? products[idx] : null;
  if (!p) return;
  const target = p.url;
  if (target) window.open(target, '_blank');
});
load();
</script>
</body>
</html>
